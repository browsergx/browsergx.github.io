<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BrowserGX - Experimenta la web sin límites</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            -webkit-font-smoothing: antialiased;
        }

        /* Header calibrado */
        header {
            background-color: #121212;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            height: 60px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 24px 0 84px;
            width: 100%;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 800;
            font-size: 22px;
            letter-spacing: -0.5px;
            color: #ffffff;
            text-decoration: none;
        }

        .logo-icon {
            width: 22px;
            height: 22px;
            fill: #ffffff;
        }

        .logo-badge {
            background-color: #fe2c55;
            color: #ffffff;
            padding: 3px 7px;
            border-radius: 3px;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.2px;
            line-height: 1;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .nav-links a.text-link {
            color: #ffffff;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            transition: opacity 0.2s;
        }

        .nav-links a.text-link:hover {
            opacity: 0.8;
        }

        .btn-download-nav {
            background-color: #fe2c55;
            color: #ffffff;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            height: 36px;
            padding: 0 22px;
            border-radius: 18px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: background-color 0.2s;
        }

        .btn-download-nav:hover {
            background-color: #e41e45;
        }

        .btn-login {
            border: 1px solid rgba(254, 44, 85, 0.65);
            color: #fe2c55;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            height: 36px;
            padding: 0 26px;
            border-radius: 18px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: background-color 0.2s;
        }

        .btn-login:hover {
            background-color: rgba(254, 44, 85, 0.1);
        }

        .menu-dots {
            background: none;
            border: none;
            color: #ffffff;
            font-size: 20px;
            cursor: pointer;
            padding: 4px 6px;
            display: flex;
            align-items: center;
        }

        /* Contenedor Principal */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 40px 20px 60px;
        }

        h1 {
            color: #e6e6e6;
            font-size: clamp(42px, 6.2vw, 76px);
            font-weight: 700;
            line-height: 1.08;
            max-width: 960px;
            letter-spacing: -1.8px;
            margin-bottom: 30px;
        }

        .cta-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 20px;
            min-height: 80px;
            justify-content: center;
        }

        /* Botón de Descarga Principal */
        .btn-download-main {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            background-color: #fe2c55;
            color: #ffffff;
            text-decoration: none;
            font-size: 17px;
            font-weight: 600;
            width: 340px;
            max-width: 90vw;
            height: 56px;
            border-radius: 28px;
            transition: background-color 0.2s, transform 0.15s;
        }

        .btn-download-main:hover {
            background-color: #e41e45;
            transform: translateY(-1px);
        }

        .win-icon {
            width: 22px;
            height: 22px;
            fill: currentColor;
        }

        .subtext {
            color: #8a8a8a;
            font-size: 13.5px;
            margin-top: 14px;
            font-weight: 400;
        }

        /* Buscador integrado para BrowserGX */
        .browsergx-search-box {
            display: none; /* Oculto por defecto, se activa por JS si detecta BrowserGX */
            align-items: center;
            background-color: #121212;
            border: 1px solid rgba(254, 44, 85, 0.6);
            border-radius: 30px;
            width: 460px;
            max-width: 90vw;
            height: 56px;
            padding: 0 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            transition: border-color 0.2s;
        }

        .browsergx-search-box:focus-within {
            border-color: #fe2c55;
        }

        .browsergx-search-input {
            flex: 1;
            background: transparent;
            border: none;
            color: #ffffff;
            font-size: 16px;
            outline: none;
            padding-left: 10px;
        }

        .browsergx-search-input::placeholder {
            color: #8a8a8a;
        }

        .browsergx-search-btn {
            background: #fe2c55;
            border: none;
            color: #ffffff;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background-color 0.2s;
        }

        .browsergx-search-btn:hover {
            background: #e41e45;
        }

        .browsergx-search-btn svg {
            width: 16px;
            height: 16px;
            fill: #ffffff;
        }

        /* Enlaces extras inferiores */
        .extra-links {
            margin-top: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            gap: 12px;
            font-size: 14.5px;
            color: #e6e6e6;
            font-weight: 500;
        }

        .apple-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: #e6e6e6;
            text-decoration: none;
            transition: opacity 0.2s;
        }

        .apple-link:hover { opacity: 0.8; }

        .apple-icon {
            width: 15px;
            height: 15px;
            fill: currentColor;
            margin-top: -3px;
        }

        .divider { color: rgba(255, 255, 255, 0.28); margin: 0 2px; }

        .access-link {
            color: #ffffff;
            font-weight: 700;
            text-decoration: none;
            margin-left: 4px;
        }
        .access-link:hover { text-decoration: underline; }

        /* Sección de Anuncios Dinámicos */
        .ads-section {
            width: 100%;
            max-width: 1100px;
            margin-top: 60px;
            text-align: left;
        }

        .ads-title {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 24px;
            color: #ffffff;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 10px;
        }

        .ads-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(480px, 1fr));
            gap: 20px;
            justify-items: center;
        }

        /* Estilos de las tarjetas de anuncios */
        .ad-card {
            box-sizing: border-box;
            display: flex;
            width: 100%;
            max-width: 520px;
            min-height: 180px;
            overflow: hidden;
            color: #0f172a;
            font-family: Arial, sans-serif;
            text-decoration: none;
            background: #fff;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(15, 23, 42, 0.1);
            transition: box-shadow 0.2s ease, transform 0.2s ease;
        }

        .ad-card:hover {
            box-shadow: 0 6px 18px rgba(15, 23, 42, 0.16);
            transform: translateY(-2px);
        }

        .ad-card__image {
            position: relative;
            flex: 0 0 40%;
            min-width: 0;
            background: #f1f5f9;
        }

        .ad-card__image img {
            display: block;
            width: 100%;
            height: 100%;
            min-height: 180px;
            object-fit: cover;
        }

        .ad-card__badge {
            position: absolute;
            top: 10px;
            left: 10px;
            padding: 4px 7px;
            color: #475569;
            font-size: 10px;
            font-weight: 700;
            background: rgba(255, 255, 255, 0.92);
            border-radius: 999px;
        }

        .ad-card__content {
            box-sizing: border-box;
            display: flex;
            flex: 1;
            flex-direction: column;
            align-items: flex-start;
            justify-content: center;
            min-width: 0;
            padding: 18px;
        }

        .ad-card__title {
            margin: 0;
            overflow: hidden;
            font-size: 18px;
            font-weight: 700;
            text-overflow: ellipsis;
            white-space: nowrap;
            width: 100%;
        }

        .ad-card__description {
            display: -webkit-box;
            margin: 8px 0 14px;
            overflow: hidden;
            color: #475569;
            font-size: 14px;
            line-height: 1.45;
            -webkit-box-orient: vertical;
            -webkit-line-clamp: 2;
        }

        .ad-card__button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 34px;
            padding: 0 14px;
            color: #fff;
            font-size: 13px;
            font-weight: 600;
            background: #111827;
            border-radius: 6px;
        }

        .ad-card:hover .ad-card__button {
            background: #334155;
        }

        @media (max-width: 600px) {
            .ads-grid { grid-template-columns: 1fr; }
            .ad-card { flex-direction: column; }
            .ad-card__image { flex-basis: auto; height: 180px; }
            .ad-card__content { padding: 16px; }
            header { padding: 0 20px; }
            .nav-links a.text-link, .btn-login { display: none; }
        }
    </style>
</head>
<body>

    <header>
        <a href="#" class="logo-container">
            <svg class="logo-icon" viewBox="0 0 24 24">
                <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/>
            </svg>
            BrowserGX <span class="logo-badge">Web Browser</span>
        </a>

        <div class="nav-links">
            <a href="#" class="text-link">Centro de Ayuda</a>
            <a href="#" class="btn-download-nav">Descargar</a>
            <a href="#" class="btn-login">Iniciar sesión</a>
            <button class="menu-dots" aria-label="Menú">⋮</button>
        </div>
    </header>

    <main>
        <h1>Construye la experiencia<br>web definitiva</h1>
        
        <div class="cta-container">
            <!-- Botón de Descarga (Visible por defecto en otros navegadores) -->
            <div id="download-wrapper" style="display: flex; flex-direction: column; align-items: center;">
                <a href="#" class="btn-download-main">
                    <svg class="win-icon" viewBox="0 0 88 88">
                        <path d="M0 12.402l35.687-4.86v34.223H0V12.402zM39.68 6.96L87.5 0v41.765H39.68V6.96zM0 45.922h35.687v34.264L0 75.326V45.922zm39.68-.001H87.5V88l-47.82-6.721V45.921z"/>
                    </svg>
                    Descargar para Windows
                </a>
                <span class="subtext">Solo compatible con Windows 10 y superior de 64 bits</span>
            </div>

            <!-- Buscador de Google (Aparece automáticamente si se navega desde BrowserGX) -->
            <form id="browsergx-search-wrapper" class="browsergx-search-box" action="https://www.google.com/search" method="GET" target="_blank">
                <svg style="width: 20px; height: 20px; fill: #8a8a8a; margin-left: 4px;" viewBox="0 0 24 24">
                    <path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
                </svg>
                <input type="text" name="q" class="browsergx-search-input" placeholder="Buscar en Google con BrowserGX..." autocomplete="off">
                <button type="submit" class="browsergx-search-btn" aria-label="Buscar">
                    <svg viewBox="0 0 24 24">
                        <path d="M2 12h20M12 2l10 10-10 10"/>
                    </svg>
                </button>
            </form>
        </div>

        <div class="extra-links">
            <a href="#" class="apple-link">
                También disponible para
                <svg class="apple-icon" viewBox="0 0 384 512">
                    <path d="M318.7 268.7c-.2-36.7 16.4-64.4 50-84.8-18.8-26.9-47.2-41.7-84.7-44.6-35.5-2.8-74.3 20.7-88.5 20.7-15 0-49.4-19.7-76.4-19.7C63.3 141.2 4 184.8 4 273.5q0 39.3 14.4 81.2c12.8 36.7 59 126.7 107.2 125.2 25.2-.6 43-17.9 75.8-17.9 31.8 0 48.3 17.9 76.4 17.9 48.6-.7 90.4-82.5 102.6-119.3-65.2-30.7-61.7-90-61.7-91.9zm-56.6-164.2c27.3-32.4 24.8-61.9 24-72.5-24.1 1.4-52 16.4-67.9 34.9-17.5 19.8-27.8 44.3-25.6 71.9 26.1 2 49.9-11.4 69.5-34.3z"/>
                </svg>
            </a>
            <span class="divider">|</span>
            <span>¿Aún no tienes BrowserGX? <a href="#" class="access-link">Obtener acceso</a></span>
        </div>

        <!-- Sección de Anuncios Dinámicos cargados desde ads.txt -->
        <section class="ads-section">
            <div class="ads-title">Patrocinadores y Campañas</div>
            <div id="ads-container" class="ads-grid">
                <!-- Se inyecta automáticamente -->
            </div>
        </section>
    </main>

    <script>
        // Detección automática del navegador BrowserGX
        document.addEventListener('DOMContentLoaded', () => {
            const userAgent = navigator.userAgent;
            if (userAgent.includes('BrowserGX')) {
                const downloadWrapper = document.getElementById('download-wrapper');
                const searchWrapper = document.getElementById('browsergx-search-wrapper');
                
                if (downloadWrapper && searchWrapper) {
                    downloadWrapper.style.display = 'none';
                    searchWrapper.style.display = 'flex';
                }
            }

            // Carga y renderizado dinámico de ads.txt
            loadAds();
        });

        async function loadAds() {
            try {
                const response = await fetch('./ads/ads.txt');
                if (!response.ok) throw new Error('No se pudo cargar el archivo ads.txt');
                
                const text = await response.text();
                const lines = text.split('\n');
                const container = document.getElementById('ads-container');
                
                container.innerHTML = '';

                lines.forEach(line => {
                    const trimmedLine = line.trim();
                    if (!trimmedLine) return;

                    const parts = trimmedLine.split('|');
                    if (parts.length >= 4) {
                        const url = parts[0].trim();
                        const title = parts[1].trim();
                        const description = parts[2].trim();
                        const image = parts[3].trim();

                        const card = document.createElement('a');
                        card.href = url;
                        card.target = '_blank';
                        card.rel = 'noopener noreferrer';
                        card.className = 'ad-card';

                        card.innerHTML = `
                            <div class="ad-card__image">
                                <img src="${image}" alt="${title}" onerror="this.src='https://www.google.com/s2/favicons?domain=${url}&sz=128'">
                                <span class="ad-card__badge">ANUNCIO</span>
                            </div>
                            <div class="ad-card__content">
                                <h2 class="ad-card__title">${title}</h2>
                                <p class="ad-card__description">${description}</p>
                                <span class="ad-card__button">Visitar sitio web</span>
                            </div>
                        `;

                        container.appendChild(card);
                    }
                });
            } catch (error) {
                console.error('Error cargando los anuncios:', error);
                document.getElementById('ads-container').innerHTML = '<p style="color: #8a8a8a; grid-column: 1/-1;">No hay anuncios disponibles en este momento.</p>';
            }
        }
    </script>
</body>
</html>
