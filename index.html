<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Favicons organizados en la carpeta favicon -->
    <link rel="icon" type="image/x-icon" href="./favicon/favicon.ico">
    <link rel="icon" type="image/png" sizes="16x16" href="./favicon/favicon-16x16.png">
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon/favicon-32x32.png">

    <!-- Icono para dispositivos Apple (iOS) -->
    <link rel="apple-touch-icon" sizes="180x180" href="./favicon/apple-touch-icon.png">

    <!-- Iconos para Android / PWA (Chrome) -->
    <link rel="icon" type="image/png" sizes="192x192" href="./favicon/android-chrome-192x192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="./favicon/android-chrome-512x512.png">

    <!-- Manifiesto de la aplicación web -->
    <link rel="manifest" href="./favicon/site.webmanifest">
    <title>BrowserGX - Experimenta la web sin límites</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            -webkit-font-smoothing: antialiased;
        }

        /* Header minimalista */
        header {
            background-color: #121212;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            height: 60px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 24px 0 84px;
            width: 100%;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 800;
            font-size: 22px;
            letter-spacing: -0.5px;
            color: #ffffff;
            text-decoration: none;
        }

        .logo-icon {
            width: 22px;
            height: 22px;
            fill: #ffffff;
        }

        .logo-badge {
            background-color: #fe2c55;
            color: #ffffff;
            padding: 3px 7px;
            border-radius: 3px;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.2px;
            line-height: 1;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .btn-download-nav {
            background-color: #fe2c55;
            color: #ffffff;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            height: 36px;
            padding: 0 22px;
            border-radius: 18px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: background-color 0.2s;
        }

        .btn-download-nav:hover {
            background-color: #e41e45;
        }

        .menu-dots {
            background: none;
            border: none;
            color: #ffffff;
            font-size: 20px;
            cursor: pointer;
            padding: 4px 6px;
            display: flex;
            align-items: center;
        }

        /* Contenedor Principal */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 50px 20px 60px;
        }

        h1 {
            color: #e6e6e6;
            font-size: clamp(42px, 6.2vw, 76px);
            font-weight: 700;
            line-height: 1.08;
            max-width: 960px;
            letter-spacing: -1.8px;
            margin-bottom: 34px;
        }

        .cta-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            margin-bottom: 20px;
        }

        /* Botón de Descarga Principal */
        .btn-download-main {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            background-color: #fe2c55;
            color: #ffffff;
            text-decoration: none;
            font-size: 17px;
            font-weight: 600;
            width: 340px;
            max-width: 90vw;
            height: 56px;
            border-radius: 28px;
            transition: background-color 0.2s, transform 0.15s;
        }

        .btn-download-main:hover {
            background-color: #e41e45;
            transform: translateY(-1px);
        }

        .win-icon {
            width: 22px;
            height: 22px;
            fill: currentColor;
        }

        .subtext {
            color: #8a8a8a;
            font-size: 13.5px;
            margin-top: 14px;
            font-weight: 400;
        }

        /* Diseño Legítimo de Buscador de Google (Modo Oscuro Oficial) */
        .google-search-container {
            display: none; /* Oculto por defecto hasta detectar BrowserGX */
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 584px;
        }

        .google-search-bar {
            display: flex;
            align-items: center;
            width: 100%;
            height: 46px;
            background-color: #202124;
            border: 1px solid #5f6368;
            border-radius: 24px;
            padding: 0 16px;
            transition: background-color 0.15s, box-shadow 0.15s, border-color 0.15s;
        }

        .google-search-bar:hover,
        .google-search-bar:focus-within {
            background-color: #303134;
            border-color: rgba(223, 225, 229, 0);
            box-shadow: 0 1px 6px rgba(0, 0, 0, 0.6);
        }

        .google-search-icon {
            width: 20px;
            height: 20px;
            fill: #9aa0a6;
            margin-right: 12px;
            flex-shrink: 0;
        }

        .google-search-input {
            flex: 1;
            background: transparent;
            border: none;
            color: #e8eaed;
            font-family: Arial, sans-serif;
            font-size: 16px;
            outline: none;
            height: 100%;
        }

        .google-tools-icons {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-left: 8px;
        }

        .google-tools-icons svg {
            width: 22px;
            height: 22px;
            cursor: pointer;
        }

        .google-buttons {
            display: flex;
            gap: 12px;
            margin-top: 26px;
        }

        .google-btn {
            background-color: #303134;
            border: 1px solid #303134;
            border-radius: 4px;
            color: #e8eaed;
            font-family: Arial, sans-serif;
            font-size: 14px;
            padding: 0 16px;
            height: 36px;
            cursor: pointer;
            transition: border-color 0.15s, box-shadow 0.15s;
        }

        .google-btn:hover {
            border: 1px solid #5f6368;
            box-shadow: 0 1px 1px rgba(0, 0, 0, 0.1);
        }

        /* Sección de Anuncios Dinámicos */
        .ads-section {
            width: 100%;
            max-width: 1100px;
            margin-top: 60px;
            text-align: left;
        }

        .ads-title {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 24px;
            color: #ffffff;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 10px;
        }

        .ads-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(480px, 1fr));
            gap: 20px;
            justify-items: center;
        }

        /* Estilos de las tarjetas de anuncios */
        .ad-card {
            box-sizing: border-box;
            display: flex;
            width: 100%;
            max-width: 520px;
            min-height: 180px;
            overflow: hidden;
            color: #0f172a;
            font-family: Arial, sans-serif;
            text-decoration: none;
            background: #fff;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(15, 23, 42, 0.1);
            transition: box-shadow 0.2s ease, transform 0.2s ease;
        }

        .ad-card:hover {
            box-shadow: 0 6px 18px rgba(15, 23, 42, 0.16);
            transform: translateY(-2px);
        }

        .ad-card__image {
            position: relative;
            flex: 0 0 40%;
            min-width: 0;
            background: #f1f5f9;
        }

        .ad-card__image img {
            display: block;
            width: 100%;
            height: 100%;
            min-height: 180px;
            object-fit: cover;
        }

        .ad-card__badge {
            position: absolute;
            top: 10px;
            left: 10px;
            padding: 4px 7px;
            color: #475569;
            font-size: 10px;
            font-weight: 700;
            background: rgba(255, 255, 255, 0.92);
            border-radius: 999px;
        }

        .ad-card__content {
            box-sizing: border-box;
            display: flex;
            flex: 1;
            flex-direction: column;
            align-items: flex-start;
            justify-content: center;
            min-width: 0;
            padding: 18px;
        }

        .ad-card__title {
            margin: 0;
            overflow: hidden;
            font-size: 18px;
            font-weight: 700;
            text-overflow: ellipsis;
            white-space: nowrap;
            width: 100%;
        }

        .ad-card__description {
            display: -webkit-box;
            margin: 8px 0 14px;
            overflow: hidden;
            color: #475569;
            font-size: 14px;
            line-height: 1.45;
            -webkit-box-orient: vertical;
            -webkit-line-clamp: 2;
        }

        .ad-card__button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 34px;
            padding: 0 14px;
            color: #fff;
            font-size: 13px;
            font-weight: 600;
            background: #111827;
            border-radius: 6px;
        }

        .ad-card:hover .ad-card__button {
            background: #334155;
        }

        @media (max-width: 600px) {
            .ads-grid { grid-template-columns: 1fr; }
            .ad-card { flex-direction: column; }
            .ad-card__image { flex-basis: auto; height: 180px; }
            .ad-card__content { padding: 16px; }
            header { padding: 0 20px; }
        }
/* Banner de punta a punta estilo perfil / portada */
.profile-banner {
    width: 100vw;
    position: relative;
    left: 50%;
    right: 50%;
    margin-left: -50vw;
    margin-right: -50vw;
    height: 320px; /* Altura ideal panorámica para PC */
    overflow: hidden;
    background-color: #0b0f19;
    border-bottom: 1px solid rgba(255, 255, 255, 0.08);
}

.profile-banner img {
    width: 100%;
    height: 100%;
    object-fit: cover; /* Asegura que cubra de esquina a esquina sin dejar espacios */
    object-position: center;
    display: block;
}

/* Ajuste responsivo para celulares y pantallas pequeñas */
@media (max-width: 768px) {
    .profile-banner {
        height: 180px; /* Se adapta perfectamente en móviles */
    }
}
    </style>
</head>
<body>

    <header>
        <a href="#" class="logo-container">
            <svg class="logo-icon" viewBox="0 0 24 24">
                <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/>
            </svg>
            BrowserGX <span class="logo-badge">Web Browser</span>
        </a>

        <div class="nav-links">
            <a href="#" id="nav-download-btn" class="btn-download-nav">Descargar</a>
            <button class="menu-dots" aria-label="Menú">⋮</button>
        </div>
    </header>
<div class="profile-banner">
    <img src="BrowserGX-logo.jpg" alt="Browser GX Banner">
</div>
    <main>
        <h1 id="hero-title">Construye la experiencia<br>web definitiva</h1>
        
        <div class="cta-container">
            <!-- Botón de Descarga (Visible cuando NO es BrowserGX) -->
            <div id="download-wrapper" style="display: flex; flex-direction: column; align-items: center;">
                <a href="#" class="btn-download-main">
                    <svg class="win-icon" viewBox="0 0 88 88">
                        <path d="M0 12.402l35.687-4.86v34.223H0V12.402zM39.68 6.96L87.5 0v41.765H39.68V6.96zM0 45.922h35.687v34.264L0 75.326V45.922zm39.68-.001H87.5V88l-47.82-6.721V45.921z"/>
                    </svg>
                    Descargar para Windows
                </a>
                <span class="subtext">Solo compatible con Windows 10 y superior de 64 bits</span>
            </div>

            <!-- Buscador Legítimo de Google (Visible cuando SE DETECTA BrowserGX) -->
            <form id="google-search-wrapper" class="google-search-container" action="https://www.google.com/search" method="GET">
                <div class="google-search-bar">
                    <svg class="google-search-icon" viewBox="0 0 24 24">
                        <path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
                    </svg>
                    <input type="text" name="q" class="google-search-input" placeholder="Search on Google or enter a URL" autocomplete="off" autofocus>
                    
                    <div class="google-tools-icons">
                        <!-- Icono de Micrófono clásico de Google -->
                        <svg viewBox="0 0 24 24">
                            <path fill="#4285f4" d="m12 15c1.66 0 3-1.31 3-2.97v-7.02c0-1.66-1.34-3.01-3-3.01s-3 1.34-3 3.01v7.02c0 1.66 1.34 2.97 3 2.97z"/>
                            <path fill="#34a853" d="m11 18.08h2v3.92h-2z"/>
                            <path fill="#fbbc05" d="m7.05 16.87c-1.27-1.33-2.05-2.83-2.05-4.87h2c0 1.45 0.56 2.42 1.47 3.38v0.32l-1.15 1.18z"/>
                            <path fill="#ea4335" d="m12 16.93a4.97 5.25 0 0 1 -3.54 -1.55l-1.41 1.49c1.26 1.34 3.02 2.13 4.95 2.13 3.87 0 6.99-2.92 6.99-7h-1.99c0 2.92-2.24 4.93-5 4.93z"/>
                        </svg>
                    </div>
                </div>

                <div class="google-buttons">
                    <button type="submit" class="google-btn">Search with Google</button>
                    <button type="submit" name="btnI" value="1" class="google-btn">I’m going to get lucky</button>
                </div>
            </form>
        </div>

        <!-- Sección de Anuncios Dinámicos cargados desde ads.txt -->
        <section class="ads-section">
            <div class="ads-title">Patrocinadores y Campañas</div>
            <div id="ads-container" class="ads-grid">
                <!-- Se inyecta automáticamente -->
            </div>
        </section>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const userAgent = navigator.userAgent;
            
            // Detectar si el usuario navega desde BrowserGX
            if (userAgent.includes('BrowserGX') || userAgent.includes('BrowserGX.com')) {
                const heroTitle = document.getElementById('hero-title');
                const downloadWrapper = document.getElementById('download-wrapper');
                const navDownloadBtn = document.getElementById('nav-download-btn');
                const googleSearchWrapper = document.getElementById('google-search-wrapper');
                
                // Cambiar título principal
                if (heroTitle) {
                    heroTitle.textContent = 'BrowserGX Search';
                }

                // Ocultar botones de descarga
                if (downloadWrapper) downloadWrapper.style.display = 'none';
                if (navDownloadBtn) navDownloadBtn.style.display = 'none';
                
                // Mostrar buscador estilo Google
                if (googleSearchWrapper) {
                    googleSearchWrapper.style.display = 'flex';
                }
            }

            // Cargar los anuncios desde ads.txt
            loadAds();
        });

        async function loadAds() {
            try {
                const response = await fetch('./ads/ads.txt');
                if (!response.ok) throw new Error('No se pudo cargar el archivo ads.txt');
                
                const text = await response.text();
                const lines = text.split('\n');
                const container = document.getElementById('ads-container');
                
                container.innerHTML = '';

                lines.forEach(line => {
                    const trimmedLine = line.trim();
                    if (!trimmedLine) return;

                    const parts = trimmedLine.split('|');
                    if (parts.length >= 4) {
                        const url = parts[0].trim();
                        const title = parts[1].trim();
                        const description = parts[2].trim();
                        const image = parts[3].trim();

                        const card = document.createElement('a');
                        card.href = url;
                        card.target = '_blank';
                        card.rel = 'noopener noreferrer';
                        card.className = 'ad-card';

                        card.innerHTML = `
                            <div class="ad-card__image">
                                <img src="${image}" alt="${title}" onerror="this.src='https://www.google.com/s2/favicons?domain=${url}&sz=128'">
                                <span class="ad-card__badge">ANUNCIO</span>
                            </div>
                            <div class="ad-card__content">
                                <h2 class="ad-card__title">${title}</h2>
                                <p class="ad-card__description">${description}</p>
                                <span class="ad-card__button">Visitar sitio web</span>
                            </div>
                        `;

                        container.appendChild(card);
                    }
                });
            } catch (error) {
                console.error('Error cargando los anuncios:', error);
                document.getElementById('ads-container').innerHTML = '<p style="color: #8a8a8a; grid-column: 1/-1;">No hay anuncios disponibles en este momento.</p>';
            }
        }
    </script>
</body>
</html>
