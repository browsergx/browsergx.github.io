<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Loading...</title>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-N7N15XLMSW"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-N7N15XLMSW', { send_page_view: false });

    const params = new URLSearchParams(window.location.search);
    const destino = params.get('url');

    function redirigir() {
      if (destino && /^https?:\/\//i.test(destino)) {
        window.location.replace(destino);
      }
    }

    // Envía el page_view y redirige en cuanto GA confirma (o tras 600ms máximo)
    gtag('event', 'page_view', {
      event_callback: redirigir
    });
    setTimeout(redirigir, 600);
  </script>
</head>
<body></body>
</html>
